<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0a0a0a" />
<title>Sin conexión — Fuera Libreta</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0a0a0a;
    color: #f0ece1;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 24px;
    text-align: center;
    background-image: repeating-linear-gradient(
      to bottom,
      transparent,
      transparent 30px,
      rgba(255, 255, 255, 0.03) 31px
    );
  }
  img {
    width: 100%;
    max-width: 180px;
    height: auto;
  }
  h1 {
    font-size: 18px;
    font-weight: 700;
    margin: 0;
  }
  p {
    font-size: 14px;
    color: #a8a29a;
    margin: 0;
    max-width: 280px;
  }
  button {
    margin-top: 8px;
    border: none;
    border-radius: 999px;
    padding: 10px 20px;
    font-size: 14px;
    font-weight: 600;
    color: #1a1608;
    background: #f6aa28;
    cursor: pointer;
  }
</style>
</head>
<body>
  <img src="/icons/icon-512-transparent.png" alt="" />
  <h1>Sin conexión</h1>
  <p>No pudimos cargar esta pantalla porque el dispositivo está sin internet. Reconéctate e intenta de nuevo.</p>
  <button type="button" onclick="location.reload()">Reintentar</button>
</body>
</html>
